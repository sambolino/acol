hit.addEventListener('pointermove',e=>{const b=svg.getBoundingClientRect(),px=(e.clientX-b.left)*W/b.width,x=D.xMin+(px-m.l)/pw*(D.xMax-D.xMin),p=nearestCurve(Math.max(D.xMin,Math.min(D.xMax,x))),q=nearestDB(p.x);cross.setAttribute('x1',sx(p.x));cross.setAttribute('x2',sx(p.x));cross.style.opacity=.65;const interval=D.modelType==='gpr'?`<br>95%: ${fmt(p.lo)} – ${fmt(p.hi)}`:'';tip.innerHTML=`<b>${D.tooltipLabel}</b><br>${D.xLabel} = ${fmt(p.x)} ${D.xUnit}<br>${D.yLabel} = ${fmt(p.y)} ${D.yUnit}${interval}<br><span style="color:#cbd5e1">Nearest DB value: ${D.xLabel}=${fmt(q.x)}, ${D.yLabel}=${fmt(q.y)}</span>`;tip.style.display='block';positionTip(e)});hit.addEventListener('pointerleave',hide);
D.points.forEach((p,i)=>{const c=el('circle',{cx:sx(p.x),cy:sy(p.y),r:4,class:'db-point'});c.addEventListener('pointerenter',e=>{tip.innerHTML=`<b>DB value #${i+1}</b><br>${D.xLabel} = ${fmt(p.x)} ${D.xUnit}<br>${D.yLabel} = ${fmt(p.y)} ${D.yUnit}`;tip.style.display='block';positionTip(e)});c.addEventListener('pointermove',positionTip);c.addEventListener('pointerleave',hide)});
function reportHeight(){const card=document.querySelector('.card'),padding=parseFloat(getComputedStyle(document.body).paddingBottom)||0;window.parent.postMessage({type:'acol-artifact-height',height:Math.ceil(card.getBoundingClientRect().bottom+padding+12)},'*')}window.addEventListener('load',reportHeight);window.addEventListener('resize',reportHeight);if(window.ResizeObserver)new ResizeObserver(reportHeight).observe(document.body);
</script>
