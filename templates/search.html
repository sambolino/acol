<body>
	<div id = "header">
      <table width="100%">
         <tr>
            <td width="220">
               <img src="{{BASE_URL}}/static/images/lapc.jpg" title="LAPC Logo"/>
            </td>
            <td align="center">
               <h2>LACP@IPB e/Mol RADAM DATABASE</h2><br />
               <h5><a href="http://mail.ipb.ac.rs/~centar3/acp.html" target="_blank">Laboratory for Atomic Collision Processes</a> ::

               <img src="{{BASE_URL}}/static/images/nanoIBCT.jpg" title="nanoIBCT Logo"/>
            </td>
         </tr>
      </table>
	</div>
    
	<div id="wrapper">
		
        <div class = "styled-select">
            <!--h2>Search the database</h2-->
            <p align="center">
                Search for {% if requestables %}
                <select id='searchRequest'>
                {% for item in requestables %}
                    <option>{{item}}</option>
                {% endfor %}
                </select>
                {% endif %}
                with conditions 
                <input type="text" id="searchCondition" value=""/><input type="submit" value="Search" onclick="UpdateResults()">
            </p>
            
            
            
            <div id="results" style="position:relative;">
                <div id="div2" style="max-height:100%;overflow:auto;">
                    <div id="XMLHolder"></div>
                </div>
            </div>
        
        </div>
	</div>
	    
	<div id="footer">
            <img width="600" src="{{BASE_URL}}/static/images/partners.jpg"/>
	</div>
    
    <script type="text/javascript">
        function updateResultsSize() {
            var res = document.getElementById('results');
            var foot = document.getElementById('footer');
            var h = foot.offsetTop - res.offsetTop
            res.style.cssText="height:" + h + "; position:relative;";
        }
        window.onresize = function () {
            updateResultsSize()
        }
        function UpdateResults()
        {
            xsamsDoc = null;
            updateResultsSize()
            var searchString = "select " + document.getElementById('searchRequest').value;
            if (document.getElementById('searchCondition').value != '')
                searchString += " where " + document.getElementById('searchCondition').value
            var str = "{{BASE_URL}}/tap/sync?REQUEST=doQuery&LANG=VSS2RDM&FORMAT=XSAMS&QUERY=" + searchString;
            //LoadXMLString("XMLHolder", '');
            document.getElementById('XMLHolder').innerHTML = 'Loading...';
            LoadXML("XMLHolder",str);
        }
    </script>
